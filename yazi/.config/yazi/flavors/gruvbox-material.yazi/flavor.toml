# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#a89984" }

# Find
find_keyword  = { fg = "#d8a657", bold = true, italic = true, underline = true }
find_position = { fg = "#d3869b", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#a9b665", bg = "#a9b665" }
marker_cut      = { fg = "#ea6962", bg = "#ea6962" }
marker_marked   = { fg = "#89b482", bg = "#89b482" }
marker_selected = { fg = "#d8a657", bg = "#d8a657" }

# Count
count_copied   = { fg = "#282828", bg = "#a9b665" }
count_cut      = { fg = "#282828", bg = "#ea6962" }
count_selected = { fg = "#282828", bg = "#d8a657" }

# Border
border_symbol = "│"
border_style  = { fg = "#928374" }

# : }}}


# : Tabs {{

[tabs]
active   = { fg = "#1d2021", bg = "#bdae93", bold = true }
inactive = { fg = "#928374", bg = "#32302f" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#1d2021", bg = "#bdae93", bold = true }
normal_alt  = { fg = "#928374", bg = "#32302f" }

# Select mode
select_main = { fg = "#282828", bg = "#89b482", bold = true }
select_alt  = { fg = "#89b482", bg = "#32302f" }

# Unset mode
unset_main = { fg = "#282828", bg = "#ea6962", bold = true }
unset_alt  = { fg = "#ea6962", bg = "#32302f" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#928374" }
perm_type  = { fg = "#7daea3" }
perm_read  = { fg = "#d8a657" }
perm_write = { fg = "#ea6962" }
perm_exec  = { fg = "#a9b665" }

# Progress
progress_label  = { fg = "#ddc7a1", bold = true }
progress_normal = { fg = "#a9b665", bg = "#45403d" }
progress_error  = { fg = "#d8a657", bg = "#ea6962" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#7daea3" }
active   = { fg = "#d3869b", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#7daea3" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#7daea3" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#7daea3" }
title   = {}
hovered = { fg = "#d3869b", bold = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#32302f" }
cand            = { fg = "#89b482" }
rest            = { fg = "#a89984" }
desc            = { fg = "#d3869b" }
separator       = "  "
separator_style = { fg = "#7c6f64" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#89b482" }
run     = { fg = "#d3869b" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#32302f", bg = "#d4be98" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#7daea3" }
title    = { fg = "#a89984" }
tbl_col  = { fg = "#a89984" }
tbl_cell = { fg = "#d4be98", bg = "#3c3836" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#a9b665" }
title_warn  = { fg = "#d8a657" }
title_error = { fg = "#ea6962" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "image/*", fg = "#83a598" },
	# Media
	{ mime = "{audio,video}/*", fg = "#d79921" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#928374" },
	# Document
	{ mime = "application/{pdf,doc,rtf}", fg = "#bdae93" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#a89984" },
	# Fallback
	{ url = "*", fg = "#d4be98" },
	{ url = "*/", fg = "#7daea3" },
]

[icon]
dirs = [
	{ name = ".config",     text = "", fg = "#928374" },
	{ name = ".git",        text = "", fg = "#a89984" },
	{ name = ".github",     text = "", fg = "#7c6f64" },
	{ name = ".npm",        text = "", fg = "#7c6f64" },

	{ name = "Desktop",     text = "", fg = "#a89984" },
	{ name = "Development", text = "󰲋", fg = "#a89984" },
	{ name = "Documents",   text = "󰈙", fg = "#a89984" },
	{ name = "Downloads",   text = "󰇚", fg = "#a89984" },
	{ name = "Library",     text = "󰂺", fg = "#928374" },
	{ name = "Movies",      text = "󰎁", fg = "#a89984" },
	{ name = "Music",       text = "󰝚", fg = "#a89984" },
	{ name = "Pictures",    text = "󰉏", fg = "#a89984" },
	{ name = "Public",      text = "󰉌", fg = "#928374" },
	{ name = "Videos",      text = "󰕧", fg = "#a89984" },
]

conds = [
	# Special files
	{ if = "orphan", text = "󰌹", fg = "#bdae93" },
	{ if = "link",   text = "󰌷", fg = "#928374" },

	{ if = "block",  text = "󰆧", fg = "#c14a4a" },
	{ if = "char",   text = "󰆍", fg = "#c14a4a" },
	{ if = "fifo",   text = "󰟦", fg = "#c14a4a" },
	{ if = "sock",   text = "󰖂", fg = "#c14a4a" },
	{ if = "sticky", text = "󰏫", fg = "#c14a4a" },
	{ if = "dummy",  text = "󰅚", fg = "#c14a4a" },

	# Fallback
	{ if = "dir",   text = "󰉋", fg = "#a89984" },
	{ if = "exec",  text = "󰆍", fg = "#98971a" },
	{ if = "!dir",  text = "󰈔", fg = "#bdae93" },
]

# : }}}
