# HYPRLAND
# ============================================================

;lock|exact|background|hyprlock|Lock Screen|Hyprland
;reload|exact|background|hyprctl reload|Reload Hyprland|Hyprland
;kill|exact|background|hyprctl dispatch killactive|Close Active Window|Hyprland
;float|exact|background|hyprctl dispatch togglefloating|Toggle Floating|Hyprland
;fullscreen|exact|background|hyprctl dispatch fullscreen 0|Toggle Fullscreen|Hyprland
;pin|exact|background|hyprctl dispatch pin|Pin Active Window|Hyprland
;exit|exact|background|hyprctl dispatch exit|Exit Hyprland|Hyprland


