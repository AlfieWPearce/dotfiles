
# ============================================================
#                    ROFI COMMAND HUB
# ============================================================
#
# FORMAT:
# TRIGGER|MATCH|ACTION|TARGET|DESCRIPTION|CATEGORY
#
# MATCH:
#   exact  = Trigger must match exactly
#   prefix = Trigger followed by arguments
#
# ACTION:
#   web        = Open URL with encoded search query
#   background = Run detached in background
#   terminal   = Run inside a new Kitty window
#   help       = Display generated command list
#
# ALIASES:
#   ?g,?google|prefix|web|...
#
# INTERNAL COMMANDS USE ;
# WEB SEARCHES USE ?
# SHELL COMMANDS USE >
# TERMINAL COMMANDS USE >t
#
# ============================================================


# ============================================================
# HELP
# ============================================================

;help|exact|help||Show all commands|General


# ============================================================
# WEB SEARCH
# ============================================================

?|prefix|web|https://www.google.com/search?q=|Default (Google) Search|Web
?g,?google|prefix|web|https://www.google.com/search?q=|Google Search|Web
?ddg,?duck|prefix|web|https://duckduckgo.com/?q=|DuckDuckGo Search|Web
?yt,?youtube|prefix|web|https://www.youtube.com/results?search_query=|YouTube Search|Web
?wiki,?wikipedia|prefix|web|https://en.wikipedia.org/wiki/Special:Search?search=|Wikipedia Search|Web
?reddit,?r|prefix|web|https://www.reddit.com/search/?q=|Reddit Search|Web
?gh,?github|prefix|web|https://github.com/search?q=|GitHub Search|Development
?stackoverflow,?so|prefix|web|https://stackoverflow.com/search?q=|Stack Overflow Search|Development
?maps|prefix|web|https://www.google.com/maps/search/|Google Maps Search|Web
?images,?img|prefix|web|https://www.google.com/search?tbm=isch&q=|Image Search|Web
?news|prefix|web|https://news.google.com/search?q=|Google News Search|Web
?translate|prefix|web|https://translate.google.com/?sl=auto&tl=en&text=|Google Translate|Web


