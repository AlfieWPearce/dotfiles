#source=~/.config/hypr/hyprlock/colors.conf
# below is an override version for gruvbox
# Variables
$text_color = rgba(ebdbb2FF)
$entry_background_color = rgba(181b2711)
$entry_border_color = rgba(3c383655)
$entry_color = rgba(ebdbb2FF)
$font_family = Google Sans Flex Medium
$font_family_clock = Google Sans Flex Medium
$font_material_symbols = Iosevka Nerd Font Propo

#$background_image = /mnt/shared/Wallpapers/wallpaper.jpg
$background_image = ~/.config/themes/current-wallpaper

# ----------------------------------------------------------------------------
# Background
# ----------------------------------------------------------------------------
background {
    #color = rgba(282828ff)
    path = $background_image
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ----------------------------------------------------------------------------
# General Settings
# ----------------------------------------------------------------------------
general {
#   hide_cursor = true
  ignore_empty_input = true
}

# ----------------------------------------------------------------------------
# Animations
# ----------------------------------------------------------------------------
animations {
    animation = fade,    1, 6, default
    animation = fadeIn,  1, 6, default
    animation = fadeOut, 1, 6, default
}

# ----------------------------------------------------------------------------
# Password Input Field
# ----------------------------------------------------------------------------
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = true

    position = 0, 20
    halign = center
    valign = center
}

# ----------------------------------------------------------------------------
# Caps lock display - red outline
# ----------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 0, -25
    halign = center
    valign = center
}

# ----------------------------------------------------------------------------
# Clock & Date Display
# ----------------------------------------------------------------------------

#Time
label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 65
    font_family = $font_family_clock

    position = 0, 300
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:5000] date +"%A, %d %B"
    color = $text_color
    font_size = 17
    font_family = $font_family_clock

    position = 0, 240
    halign = center
    valign = center
}

# ----------------------------------------------------------------------------
# Username
# ----------------------------------------------------------------------------
label { # User
    monitor =
#    text =     $USER
    text = $USER
    color = $text_color
# Great but can't be seen by old version of hyprlock
    # outline_thickness = 2
    # dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    # dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    # dots_center = true
    font_size = 20
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

# ----------------------------------------------------------------------------
# Status
# ----------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_color
    font_size = 14
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
}

# ----------------------------------------------------------------------------
# Power Control Buttons
# ----------------------------------------------------------------------------

# Shutdown Button
label {
    monitor =
    # Material Symbols Rounded icon for power_settings_new (Unicode U+E8AC)
    text = 󰐥
    color = $text_color # Icon color
    font_size = 24
    font_family = $font_material_symbols

    # Position
    position = 30, 30
    halign = left
    valign = bottom

    # The magic: execute command on click
    onclick = hyprshutdown -t "Shutting down..." -p 'shutdown -P 0'
}

# Reboot Button
label {
    monitor =
    # Material Symbols Rounded icon for restart_alt (Unicode U+E02A)
    text = 󰜉
    color = $text_color # Icon color
    font_size = 24
    font_family = $font_material_symbols

    # Position
    position = 100, 30
    halign = left
    valign = bottom

    # The magic: execute command on click
	onclick = hyprshutdown -t 'Restarting...' -p 'reboot'
}

# Suspend Button
label {
    monitor =
    text = 󰤄
    color = $text_color # Icon color
    font_size = 24
    font_family = $font_material_symbols

    # Position
    position = 170, 30
    halign = left
    valign = bottom

    # The magic: execute command on click
    onclick = systemctl suspend
}
