#
# zephyr.toml - Zephyr default prompt theme
#

add_newline = false

# A minimal left prompt
format = """$python$directory$character"""

# move the rest of the prompt to the right
#right_format = """$status$git_branch${custom.git_status_dirty}$git_status"""
right_format = """$status$cmd_duration$git_branch${custom.git_status_dirty}$git_status$shell"""

palette="greyscale"

# Define custom colors
[palettes.greyscale]
black = '#1d2021'
red = '#cc241d'
grey = '#928374'
white = '#ebdbb2'

[palettes.greyscale_256]
black = '16'
white = '146'

[character]
success_symbol = "[❯](grey)[❯](white)"
error_symbol   = "[❯](grey)[❯](red)"
# vicmd_symbol = "[❮](grey)[❮](white)"

[python]
format = '[(\($virtualenv\) )]($style)'
style  = 'white'

[directory]
style = "white"
truncation_length = 1
truncation_symbol = ""
fish_style_pwd_dir_length = 1

[shell]
disabled = false
format = '[$indicator]($style)'
style = "grey"

bash_indicator = " :bash"
zsh_indicator = " :zsh"
fish_indicator = " :fish"
unknown_indicator = ""

# right prompt uses left space padding
[git_branch]
format = ' [$branch]($style)'
style  = 'grey'

[git_status]
format = '( [\[$ahead_behind$stashed\]]($style))'
style  = "white"
stashed= "≡"
ahead  = "${count}"
behind = "${count}"

[custom.git_status_dirty]
when  = 'test -n "$(git status --porcelain 2>/dev/null)"'
symbol= "•"
style = "white"
format="[$symbol]($style)"
shell = ["sh"]

[cmd_duration]
style  = "grey"
format = ' [$duration]($style)'

[line_break]
disabled = false

[status]
disabled = false
style    = "bold red"
symbol   = ' ✘'
